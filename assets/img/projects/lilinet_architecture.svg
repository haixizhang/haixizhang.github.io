<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">LiLiNet model architecture</title>
  <desc id="desc">Paper-style diagram of paired LiDAR inputs, spherical rasterization, shared encoders, circular azimuth correlation, multi-scale fusion, residual pose heads, robust aggregation, and sensor rig update.</desc>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#40546a"/>
    </marker>
    <style>
      .title{font:700 25px Arial,sans-serif;fill:#152535}.subtitle{font:400 13px Arial,sans-serif;fill:#607387}
      .section{font:700 12px Arial,sans-serif;letter-spacing:1.4px;fill:#52677a}.blockTitle{font:700 16px Arial,sans-serif;fill:#142536}
      .blockText{font:400 12px Arial,sans-serif;fill:#53677a}.tensor{font:italic 13px Georgia,serif;fill:#283b4d}
      .box{stroke-width:1.3}.input{fill:#eef6ff;stroke:#7aaee6}.geom{fill:#fff6dd;stroke:#d7aa49}.encoder{fill:#eef9f2;stroke:#63aa7c}
      .fusion{fill:#f4efff;stroke:#9574d1}.head{fill:#fff0f3;stroke:#cf7084}.output{fill:#eaf8f7;stroke:#4b9e99}
      .loss{fill:#f7f8fa;stroke:#aeb9c4}.line{fill:none;stroke:#40546a;stroke-width:1.55;marker-end:url(#arrow2)}
      .dash{fill:none;stroke:#7b8794;stroke-width:1.35;stroke-dasharray:6 5;marker-end:url(#arrow2)}
      .branch{fill:none;stroke:#40546a;stroke-width:1.3}.note{font:600 11px Arial,sans-serif;fill:#697b8c}
    </style>
  </defs>

  <rect width="1280" height="660" rx="18" fill="#ffffff"/>
  <text x="38" y="42" class="title">LiLiNet — Full-Azimuth Neural LiDAR–LiDAR Calibration</text>
  <text x="38" y="66" class="subtitle">Shared spherical features and circular correlation make angular displacement explicit before SE(3) residual estimation.</text>

  <text x="42" y="96" class="section">PAIRED OBSERVATIONS</text>
  <text x="246" y="96" class="section">SPHERICAL PROJECTION</text>
  <text x="482" y="96" class="section">SHARED ENCODER</text>
  <text x="686" y="96" class="section">AZIMUTH MATCHING</text>
  <text x="934" y="96" class="section">POSE HEADS</text>
  <text x="1118" y="96" class="section">OUTPUT</text>

  <rect x="38" y="118" width="164" height="82" rx="10" class="box input"/>
  <text x="120" y="147" text-anchor="middle" class="blockTitle">Main LiDAR</text>
  <text x="120" y="171" text-anchor="middle" class="tensor">P_M = {(x,y,z,i)}</text>
  <text x="120" y="189" text-anchor="middle" class="blockText">synchronized keyframe</text>

  <rect x="38" y="260" width="164" height="82" rx="10" class="box input"/>
  <text x="120" y="289" text-anchor="middle" class="blockTitle">Blind-Spot LiDAR</text>
  <text x="120" y="313" text-anchor="middle" class="tensor">P_B = {(x,y,z,i)}</text>
  <text x="120" y="331" text-anchor="middle" class="blockText">synchronized keyframe</text>

  <rect x="38" y="430" width="164" height="88" rx="10" class="box input"/>
  <text x="120" y="458" text-anchor="middle" class="blockTitle">Initial Extrinsics</text>
  <text x="120" y="482" text-anchor="middle" class="tensor">T_init ∈ SE(3)</text>
  <text x="120" y="503" text-anchor="middle" class="blockText">plus sensor-position ID</text>

  <rect x="240" y="112" width="188" height="100" rx="10" class="box geom"/>
  <text x="334" y="141" text-anchor="middle" class="blockTitle">Spherical Rasterizer</text>
  <text x="334" y="164" text-anchor="middle" class="tensor">S(P_M) ∈ Rᶜ×²⁵⁶×¹⁵³⁶</text>
  <text x="334" y="187" text-anchor="middle" class="blockText">range · density · intensity</text>

  <rect x="240" y="252" width="188" height="100" rx="10" class="box geom"/>
  <text x="334" y="281" text-anchor="middle" class="blockTitle">Pose-Aware Rasterizer</text>
  <text x="334" y="304" text-anchor="middle" class="tensor">S(T_init P_B)</text>
  <text x="334" y="327" text-anchor="middle" class="blockText">overlap · full 360° azimuth</text>

  <rect x="240" y="430" width="188" height="88" rx="10" class="box geom"/>
  <text x="334" y="458" text-anchor="middle" class="blockTitle">Position Embedding</text>
  <text x="334" y="482" text-anchor="middle" class="tensor">z_s → conditioning</text>
  <text x="334" y="503" text-anchor="middle" class="blockText">heterogeneous viewpoint prior</text>

  <rect x="468" y="112" width="174" height="100" rx="10" class="box encoder"/>
  <text x="555" y="141" text-anchor="middle" class="blockTitle">Shared Encoder</text>
  <text x="555" y="164" text-anchor="middle" class="blockText">ResNet-18 style · GroupNorm</text>
  <text x="555" y="187" text-anchor="middle" class="tensor">F_M¹⁄⁸ , F_M¹⁄³²</text>

  <rect x="468" y="252" width="174" height="100" rx="10" class="box encoder"/>
  <text x="555" y="281" text-anchor="middle" class="blockTitle">Shared Weights</text>
  <text x="555" y="304" text-anchor="middle" class="blockText">same feature geometry</text>
  <text x="555" y="327" text-anchor="middle" class="tensor">F_B¹⁄⁸ , F_B¹⁄³²</text>

  <rect x="674" y="124" width="226" height="126" rx="10" class="box fusion"/>
  <text x="787" y="154" text-anchor="middle" class="blockTitle">Circular Azimuth Correlation</text>
  <text x="787" y="181" text-anchor="middle" class="tensor">C(δ) = Σ F_M(u) · F_B(u+δ)</text>
  <text x="787" y="205" text-anchor="middle" class="blockText">wrap-around matching over 360°</text>
  <text x="787" y="227" text-anchor="middle" class="blockText">explicit rotational displacement signal</text>

  <rect x="674" y="286" width="226" height="112" rx="10" class="box fusion"/>
  <text x="787" y="316" text-anchor="middle" class="blockTitle">Multi-Scale Geometry Fusion</text>
  <text x="787" y="342" text-anchor="middle" class="tensor">local 1/8 + global 1/32</text>
  <text x="787" y="365" text-anchor="middle" class="blockText">overlap-aware context</text>
  <text x="787" y="386" text-anchor="middle" class="blockText">position-conditioned features</text>

  <rect x="930" y="136" width="152" height="100" rx="10" class="box head"/>
  <text x="1006" y="165" text-anchor="middle" class="blockTitle">Rotation Head</text>
  <text x="1006" y="189" text-anchor="middle" class="blockText">correlation + global context</text>
  <text x="1006" y="214" text-anchor="middle" class="tensor">q_pred / ||q_pred||</text>

  <rect x="930" y="292" width="152" height="100" rx="10" class="box head"/>
  <text x="1006" y="321" text-anchor="middle" class="blockTitle">Translation Head</text>
  <text x="1006" y="345" text-anchor="middle" class="blockText">local + coarse geometry</text>
  <text x="1006" y="370" text-anchor="middle" class="tensor">t_pred ∈ R³</text>

  <rect x="1110" y="174" width="134" height="88" rx="10" class="box output"/>
  <text x="1177" y="202" text-anchor="middle" class="blockTitle">Residual Pose</text>
  <text x="1177" y="227" text-anchor="middle" class="tensor">ΔT_pred ∈ SE(3)</text>
  <text x="1177" y="247" text-anchor="middle" class="blockText">per keyframe</text>

  <rect x="1110" y="304" width="134" height="112" rx="10" class="box output"/>
  <text x="1177" y="332" text-anchor="middle" class="blockTitle">Robust Runtime</text>
  <text x="1177" y="355" text-anchor="middle" class="blockText">multi-frame aggregation</text>
  <text x="1177" y="376" text-anchor="middle" class="blockText">health classification</text>
  <text x="1177" y="397" text-anchor="middle" class="tensor">T_final = ΔT T_init</text>

  <path d="M202 159 H240" class="line"/><path d="M428 162 H468" class="line"/>
  <path d="M202 301 H240" class="line"/><path d="M428 302 H468" class="line"/>
  <path d="M202 474 H240" class="line"/><path d="M428 474 H654 V370 H674" class="dash"/>
  <path d="M642 162 H660 V169 H674" class="line"/><path d="M642 302 H660 V211 H674" class="line"/>
  <path d="M642 186 H654 V320 H674" class="line"/><path d="M642 326 H674" class="line"/>
  <path d="M900 187 H930" class="line"/><path d="M900 342 H930" class="line"/>
  <path d="M900 342 H916 V212 H930" class="branch"/><path d="M900 187 H916 V316 H930" class="branch"/>
  <path d="M1082 186 H1096 V206 H1110" class="branch"/><path d="M1082 342 H1096 V238 H1110" class="line"/>
  <path d="M1177 262 V304" class="line"/>
  <path d="M202 498 H216 V410 H1177 V416" class="dash"/>

  <text x="40" y="568" class="section">TRAINING &amp; DEPLOYMENT CONTRACT</text>
  <rect x="38" y="584" width="262" height="50" rx="8" class="box loss"/>
  <text x="169" y="606" text-anchor="middle" class="blockTitle">Geodesic Rotation</text><text x="169" y="625" text-anchor="middle" class="tensor">d_SO(3)(R_pred,R_gt)</text>
  <rect x="320" y="584" width="262" height="50" rx="8" class="box loss"/>
  <text x="451" y="606" text-anchor="middle" class="blockTitle">Robust Translation</text><text x="451" y="625" text-anchor="middle" class="tensor">SmoothL1(t_pred,t_gt)</text>
  <rect x="602" y="584" width="330" height="50" rx="8" class="box loss"/>
  <text x="767" y="606" text-anchor="middle" class="blockTitle">Trimmed Point Consistency</text><text x="767" y="625" text-anchor="middle" class="tensor">ρ_trim(T_final P_B, T_gt P_B)</text>
  <rect x="952" y="584" width="292" height="50" rx="8" class="box output"/>
  <text x="1098" y="606" text-anchor="middle" class="blockTitle">PyTorch → ONNX → TensorRT → C++</text>
  <text x="1098" y="625" text-anchor="middle" class="blockText">same tensor and geometry contract</text>
</svg>
