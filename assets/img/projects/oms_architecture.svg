<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">In-cabin occupant state perception architecture</title>
  <desc id="desc">Fisheye RGB frames are divided into versioned seat regions, encoded with a shared ResNet18, and passed to occupancy and posture-classification heads followed by deterministic output gating.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fd"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="feature" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7357c9"/>
      <stop offset="1" stop-color="#2a8fad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1d3144" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#577489"/>
    </marker>
    <style>
      .label{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#687b8b}.title{font:700 29px Arial,sans-serif;fill:#142c3d}.small{font:400 18px Arial,sans-serif;fill:#71818e}.tiny{font:700 15px Arial,sans-serif;letter-spacing:1.3px;fill:#8a6fc9}.node{fill:#fff;stroke:#cad8e2;stroke-width:2}.line{fill:none;stroke:#577489;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <path d="M0 118 H1600" stroke="#d5e0e8"/>
  <text x="72" y="65" class="label">CURRENT VISUAL BASELINE</text>
  <text x="72" y="96" class="small">Per-seat, multi-task occupant perception · RGB only</text>
  <g filter="url(#shadow)">
    <rect x="68" y="186" width="260" height="348" rx="18" class="node"/>
    <path d="M100 256 Q198 184 296 256 V420 Q198 494 100 420 Z" fill="#172f42"/>
    <path d="M113 287 Q198 225 283 287" fill="none" stroke="#4bb6ca" stroke-width="4"/>
    <path d="M113 385 Q198 447 283 385" fill="none" stroke="#9b79df" stroke-width="4"/>
    <circle cx="151" cy="330" r="34" fill="#b9d6df"/>
    <circle cx="245" cy="330" r="34" fill="#c8bce8"/>
    <path d="M121 403 Q151 362 181 403" fill="#b9d6df"/>
    <path d="M215 403 Q245 362 275 403" fill="#c8bce8"/>
    <text x="98" y="572" class="tiny">INPUT</text>
    <text x="98" y="608" class="title">Fisheye frame</text>
    <text x="98" y="638" class="small">front / rear cabin view</text>
  </g>
  <path d="M329 360 H403" class="line"/>
  <g filter="url(#shadow)">
    <rect x="407" y="186" width="286" height="348" rx="18" class="node"/>
    <rect x="444" y="236" width="94" height="96" rx="10" fill="#e6f2f5" stroke="#55a6b6" stroke-width="3"/>
    <rect x="560" y="236" width="94" height="96" rx="10" fill="#efeafa" stroke="#8e73cf" stroke-width="3"/>
    <rect x="444" y="354" width="94" height="96" rx="10" fill="#efeafa" stroke="#8e73cf" stroke-width="3"/>
    <rect x="560" y="354" width="94" height="96" rx="10" fill="#e6f2f5" stroke="#55a6b6" stroke-width="3"/>
    <text x="474" y="292" class="label">S1</text><text x="590" y="292" class="label">S2</text>
    <text x="474" y="410" class="label">S3</text><text x="590" y="410" class="label">S4</text>
    <text x="442" y="572" class="tiny">GEOMETRY</text>
    <text x="442" y="608" class="title">Versioned seat ROIs</text>
    <text x="442" y="638" class="small">fixed crop and seat identity</text>
  </g>
  <path d="M694 360 H768" class="line"/>
  <g filter="url(#shadow)">
    <rect x="772" y="186" width="296" height="348" rx="18" fill="#fff" stroke="#8064c5" stroke-width="2.5"/>
    <rect x="815" y="236" width="210" height="42" rx="8" fill="#e6e0f7"/>
    <rect x="834" y="296" width="172" height="42" rx="8" fill="#d8e9f0"/>
    <rect x="855" y="356" width="130" height="42" rx="8" fill="#c5dfe6"/>
    <rect x="876" y="416" width="88" height="42" rx="8" fill="url(#feature)"/>
    <text x="807" y="572" class="tiny">SHARED ENCODER</text>
    <text x="807" y="608" class="title">ResNet-18</text>
    <text x="807" y="638" class="small">one representation across seats</text>
  </g>
  <path d="M1069 360 H1133" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1137" y="174" width="394" height="170" rx="18" class="node"/>
    <circle cx="1186" cy="235" r="22" fill="#e2f2f1" stroke="#3e9f9c" stroke-width="3"/>
    <path d="M1176 235 l7 8 15-19" fill="none" stroke="#2d8f8d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1225" y="220" class="tiny">HEAD 01</text>
    <text x="1225" y="257" class="title">Occupancy</text>
    <text x="1225" y="287" class="small">per-seat probability</text>
    <rect x="1137" y="376" width="394" height="170" rx="18" class="node"/>
    <path d="M1172 465 q14-35 28 0" fill="none" stroke="#8769c9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1186" cy="424" r="18" fill="#ece6f8" stroke="#8769c9" stroke-width="3"/>
    <text x="1225" y="422" class="tiny">HEAD 02</text>
    <text x="1225" y="459" class="title" style="font-size:24px">Posture classification</text>
    <text x="1225" y="489" class="small">forward · upright · reclined</text>
  </g>
  <path d="M1334 548 V598" class="line"/>
  <rect x="1114" y="604" width="440" height="72" rx="14" fill="#142c3d"/>
  <text x="1150" y="632" style="font:700 15px Arial,sans-serif;letter-spacing:1.2px;fill:#78d4d0">DETERMINISTIC OUTPUT GATE</text>
  <text x="1150" y="658" style="font:400 18px Arial,sans-serif;fill:#d9e8ed">seat state · confidence · explicit unknown behavior</text>
</svg>
