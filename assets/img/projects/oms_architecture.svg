<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Integrated in-cabin occupant perception system</title>
  <desc id="desc">Cabin RGB feeds RTMO person and hip detection, ROI posture classification, and VLM attributes. iToF and seat-track signals provide seating position. Per-seat temporal state and confidence rules combine the evidence into a unified vehicle message.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#577489"/></marker>
    <style>text{font-family:Arial,sans-serif}.eyebrow{font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#567285}.heading{font-size:25px;font-weight:700;fill:#142c3d}.body{font-size:19px;fill:#526b7d}.small{font-size:17px;fill:#637a8b}.box{fill:white;stroke:#cad8e2;stroke-width:2}.line{fill:none;stroke:#577489;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="950" rx="18" fill="#f3f7fa"/>
  <text x="55" y="57" class="eyebrow">OCCUPANT PERCEPTION · COMPLETE SYSTEM</text>
  <text x="55" y="91" class="body">Detection + posture + seating position + temporally fused attributes</text>
  <rect x="55" y="153" width="255" height="465" rx="16" class="box"/>
  <text x="81" y="196" class="eyebrow">VISUAL INPUT</text>
  <text x="81" y="239" class="heading">Cabin RGB</text>
  <rect x="81" y="276" width="204" height="185" rx="16" fill="#142c3d"/>
  <path d="M100 325Q183 266 265 325M100 414Q183 473 265 414" fill="none" stroke="#79c8cb" stroke-width="4"/>
  <circle cx="147" cy="356" r="25" fill="#b7d8e4"/>
  <circle cx="222" cy="356" r="25" fill="#c6bde6"/>
  <path d="M120 420Q147 375 174 420M195 420Q222 375 249 420" fill="#b7d8e4"/>
  <text x="81" y="512" class="body">Fisheye frames</text>
  <text x="81" y="545" class="body">Seat regions</text>
  <text x="81" y="578" class="small">Versioned preprocessing</text>
  <rect x="55" y="657" width="255" height="140" rx="16" class="box"/>
  <text x="81" y="696" class="eyebrow">PHYSICAL INPUT</text>
  <text x="81" y="736" class="heading">iToF + seat track</text>
  <text x="81" y="770" class="small">Distance / position signals</text>
  <rect x="400" y="153" width="615" height="140" rx="16" fill="#eef6ff" stroke="#7aaee6" stroke-width="2"/>
  <text x="429" y="190" class="eyebrow">PERSON + SEAT ASSOCIATION</text>
  <text x="429" y="231" class="heading">Retrained RTMO-s</text>
  <text x="429" y="266" class="body">Body boxes · hip keypoints · occupancy evidence</text>
  <rect x="400" y="321" width="615" height="140" rx="16" fill="#f4efff" stroke="#9574d1" stroke-width="2"/>
  <text x="429" y="358" class="eyebrow">POSTURE CLASSIFICATION</text>
  <text x="429" y="399" class="heading">Shared ResNet-18 + task heads</text>
  <text x="429" y="434" class="body">Occupancy + forward lean / upright / reclined</text>
  <rect x="400" y="489" width="615" height="140" rx="16" fill="#eef9f2" stroke="#63aa7c" stroke-width="2"/>
  <text x="429" y="526" class="eyebrow">ATTRIBUTE ESTIMATION</text>
  <text x="429" y="567" class="heading">Vision-language model</text>
  <text x="429" y="602" class="body">Repeated occupant readings for temporal fusion</text>
  <rect x="400" y="657" width="615" height="140" rx="16" fill="#fff6dd" stroke="#d7aa49" stroke-width="2"/>
  <text x="429" y="694" class="eyebrow">SEATING-POSITION REASONING</text>
  <text x="429" y="735" class="heading">Distance + seat-track geometry</text>
  <text x="429" y="770" class="body">Front edge vs. middle / back · upright condition</text>
  <path d="M311 386H353V223H390" class="line"/>
  <path d="M353 386H390" class="line"/>
  <path d="M353 386V559H390" class="line"/>
  <path d="M311 727H390" class="line"/>
  <rect x="1110" y="153" width="435" height="644" rx="16" fill="#142c3d"/>
  <text x="1141" y="197" style="font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#7cd4cd">PER-SEAT SYSTEM LOGIC</text>
  <text x="1141" y="250" style="font-size:25px;font-weight:700;fill:white">Temporal state + fusion</text>
  <g style="font-size:19px;fill:#d0e0e9">
    <text x="1141" y="294">Accumulate attribute readings</text>
    <text x="1141" y="326">Reset on occupant entry / exit</text>
    <text x="1141" y="399">Apply confidence and validity</text>
    <text x="1141" y="431">Preserve field-level semantics</text>
    <text x="1141" y="504">Merge vehicle context</text>
    <text x="1141" y="536">Doors · gear · seatbelt · seat pose</text>
  </g>
  <path d="M1141 581H1514" stroke="#456277"/>
  <text x="1141" y="633" style="font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#7cd4cd">UNIFIED VEHICLE MESSAGE</text>
  <text x="1141" y="677" style="font-size:22px;font-weight:700;fill:white">Occupant state by seat</text>
  <text x="1141" y="715" style="font-size:19px;fill:#d0e0e9">Estimates + confidence + validity</text>
  <text x="1141" y="751" style="font-size:19px;fill:#d0e0e9">Timestamp + sequence number</text>
  <path d="M1016 223H1100M1016 391H1100M1016 559H1100M1016 727H1100" class="line"/>
  <text x="55" y="866" class="eyebrow">QUANTIFIED ON REAL-VEHICLE RECORDINGS</text>
  <text x="55" y="905" class="body">Occupancy · posture · seating position · VLM attributes · per-task evaluation conditions</text>
</svg>
